name: Collect common package versions
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        description: One bounded pass over the R4 common whitelist
        options: [metadata, collect]
        default: collect
      packages:
        type: string
        description: Optional comma-separated common package IDs
        default: ''
permissions:
  contents: write
concurrency:
  group: catalog-single-writer
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build offline managed metadata reader
        run: PYTHONPATH=src python -m uvault.managed build
      - name: Validate tools
        run: PYTHONPATH=src python -m unittest discover -s tests -q
      - name: Prepare checkpoint author
        run: |
          git config user.name 'vault-collection'
          git config user.email 'vault-collection@users.noreply.github.com'
          PYTHONPATH=src python -c "from pathlib import Path;from uvault.pipeline import validate_snapshot;validate_snapshot(Path('catalog'))"
      - name: Collect selected common versions
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: src
          MODE: ${{ inputs.mode }}
          PACKAGES: ${{ inputs.packages }}
        shell: bash
        run: |
          args=(--root catalog --checkpoint-push --checkpoint-every 10)
          if [[ "$MODE" == metadata ]]; then args+=(--metadata --retry-failed); else args+=(--collect --publish --retry-failed); fi
          IFS=',' read -ra ids <<< "$PACKAGES"
          for id in "${ids[@]}"; do
            if [[ -n "$id" ]]; then args+=(--package "$id"); fi
          done
          python -m uvault.pipeline "${args[@]}"
      - name: Commit completed checkpoints
        if: always()
        shell: bash
        run: |
          git config user.name 'vault-collection'
          git config user.email 'vault-collection@users.noreply.github.com'
          PYTHONPATH=src python -c "from pathlib import Path;from uvault.pipeline import validate_snapshot;validate_snapshot(Path('catalog'),check_shards=True)"
          PYTHONPATH=src python scripts/render_coverage.py
          git add catalog docs/COVERAGE.md
          if ! git diff --cached --quiet; then
            git commit -q -m 'Checkpoint verified collection and remaining queue'
            git push
          fi
