[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unity-package-source-vault"
version = "0.1.0"
description = "Conservative Unity package identification and immutable source materialization"
requires-python = ">=3.10"
license = {text = "MIT (vault tools only)"}

[project.scripts]
uvault = "uvault.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/uvault" = ["sources/component-reviews.json", "sources/common-packages.json", "sources/builtin-modules.json", "sources/family-references.json"]
"share/uvault/managed-index" = ["tools/managed-index/ManagedIndex.csproj", "tools/managed-index/Program.cs"]
